<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Offer a ride | CampusRide</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header"><a class="brand" href="index.html">CampusRide</a>
        <nav><a href="offer-ride.html">Offer a ride</a><a href="find-ride.html">Find a ride</a><a href="trip-history.html">Trip history</a><a
                href="about.html">Developers</a></nav>
    </header>
    <main class="page">
        <h1>Offer a ride</h1>
        <p id="message" aria-live="polite"></p>
        <form id="offer-form" class="form"><label>Name<input name="driverName" required></label><label>Email<input
                    id="driverEmail" name="driverEmail" type="email" required></label><label>Leaving from<input
                    name="origin" required></label><label>Going to<input name="destination"
                    required></label><label>Departure time<input name="departureTime" type="datetime-local"
                    required></label><label>Available seats<input name="availableSeats" type="number" min="1" max="6"
                    required></label><label>Price per seat (AED)<input name="price" type="number" min="0" step="0.5"
                    required></label><label>Notes<textarea name="notes" maxlength="300"></textarea></label><button>Post
                ride</button></form>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
